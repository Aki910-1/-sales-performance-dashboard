<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Performance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#F4F5F7; --card:#FFFFFF; --ink:#16181D; --muted:#667085; --line:#E3E5EA;
    --a1:#3B5BDB; --a2:#12B886; --bad:#E03131;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0F1115; --card:#181B21; --ink:#ECEEF2; --muted:#98A1B3; --line:#2A2E37; --a1:#7C93FF; --a2:#3DD6A5; --bad:#FF7A7A; }
  }
  :root[data-theme="dark"] { --bg:#0F1115; --card:#181B21; --ink:#ECEEF2; --muted:#98A1B3; --line:#2A2E37; --a1:#7C93FF; --a2:#3DD6A5; --bad:#FF7A7A; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1120px; margin:0 auto; padding:28px 20px 56px; }
  header { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between; margin-bottom:22px; }
  h1 { font-size:1.5rem; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub { color:var(--muted); font-size:.85rem; margin:0; }
  .filters { display:flex; flex-wrap:wrap; gap:10px; }
  .filters label { font-size:.72rem; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  select { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:.9rem; min-width:130px; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .kpi .lbl { font-size:.78rem; color:var(--muted); margin-bottom:8px; }
  .kpi .val { font-size:1.6rem; font-weight:700; letter-spacing:-0.02em; }
  .kpi .note { font-size:.75rem; color:var(--muted); margin-top:6px; }
  .up { color:var(--a2); } .down { color:var(--bad); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  .card h2 { font-size:.95rem; margin:0 0 14px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .head h2 { margin:0; }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:transparent; color:var(--muted); border:0; padding:6px 12px; font-size:.8rem; cursor:pointer; }
  .seg button.on { background:var(--a1); color:#fff; }
  .chartbox { position:relative; height:280px; }
  .row { display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:9px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row .n { font-size:.88rem; } .row .c { font-size:.72rem; color:var(--muted); }
  .row .v { font-size:.88rem; font-weight:600; text-align:right; }
  .bar { grid-column:1/3; height:5px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:5px; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .foot { color:var(--muted); font-size:.75rem; margin-top:22px; }
  @media (max-width:820px) { .kpis { grid-template-columns:1fr 1fr; } .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sales Performance Dashboard</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="filters">
      <label>Year<select id="year"></select></label>
      <label>Region<select id="region"></select></label>
      <label>Category<select id="category"></select></label>
    </div>
  </header>

  <div class="kpis">
    <div class="card kpi"><div class="lbl">Total revenue</div><div class="val" id="k-rev"></div><div class="note" id="k-units"></div></div>
    <div class="card kpi"><div class="lbl">Total profit</div><div class="val" id="k-profit"></div><div class="note">After product cost</div></div>
    <div class="card kpi"><div class="lbl">Profit margin</div><div class="val" id="k-margin"></div><div class="note">Profit / revenue</div></div>
    <div class="card kpi"><div class="lbl" id="k-g-lbl">Growth rate</div><div class="val" id="k-growth"></div><div class="note">Revenue, year over year</div></div>
  </div>

  <div class="card">
    <div class="head">
      <h2>Sales trend</h2>
      <div class="seg" id="seg">
        <button data-g="m" class="on">Monthly</button><button data-g="q">Quarterly</button><button data-g="y">Yearly</button>
      </div>
    </div>
    <div class="chartbox"><canvas id="trend"></canvas></div>
  </div>

  <div class="grid2">
    <div class="card"><h2>Top 5 products by revenue</h2><div id="top"></div></div>
    <div class="card"><h2>Bottom 5 products by revenue</h2><div id="bottom"></div></div>
  </div>

  <div class="grid2">
    <div class="card"><h2>Region comparison</h2><div class="chartbox"><canvas id="regionChart"></canvas></div></div>
    <div class="card"><h2>Category comparison</h2><div class="chartbox"><canvas id="catChart"></canvas></div></div>
  </div>

  <p class="foot" id="foot"></p>
</div>

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const money = n => { const a=Math.abs(n), s=n<0?'-':''; return a>=1e7 ? s+'₹'+(a/1e7).toFixed(2)+' Cr' : a>=1e5 ? s+'₹'+(a/1e5).toFixed(2)+' L' : s+'₹'+Math.round(a).toLocaleString('en-IN'); };

let gran = 'm', charts = {};

// row = [year, month, region, category, product, revenue, profit, units]
function pick(skip) {
  const y=$('year').value, r=$('region').value, c=$('category').value;
  return D.rows.filter(x => (y==='All'||x[0]==y) && (skip==='region'||r==='All'||x[2]===r) && (skip==='category'||c==='All'||x[3]===c));

const sum = (rows, i) => rows.reduce((s,x) => s + x[i], 0);
function group(rows, keyFn) {
  const m = new Map();
  rows.forEach(x => { const k = keyFn(x); const a = m.get(k) || [0,0]; a[0]+=x[5]; a[1]+=x[6]; m.set(k,a); });
  return [...m.entries()].sort((a,b) => a[0] < b[0] ? -1 : 1);
}
function draw(id, cfg) {

  Chart.defaults.color = css('--muted'); Chart.defaults.borderColor = css('--line');
  charts[id] = new Chart($(id), cfg);
}
const axis = { ticks: { callback: v => money(v) } };

function render() {
  const rows = pick(), rev = sum(rows,5), profit = sum(rows,6), units = sum(rows,7);
  $('k-rev').textContent = money(rev); $('k-profit').textContent = money(profit);
  $('k-margin').textContent = rev ? (profit/rev*100).toFixed(1)+'%' : '–';
  $('k-units').textContent = units.toLocaleString('en-IN') + ' units sold';

  // Growth: selected year vs previous year (latest year vs previous when "All")
  const ysel = $('year').value, cur = ysel==='All' ? D.years[D.years.length-1] : +ysel, prev = cur-1;

  $('k-g-lbl').textContent = `Growth rate (${cur} vs ${prev})`;
  const g = $('k-growth');
  if (rp > 0) { const v=(rc-rp)/rp*100; g.textContent=(v>=0?'+':'')+v.toFixed(1)+'%'; g.className='val '+(v>=0?'up':'down'); }
  else { g.textContent='n/a'; g.className='val'; }

  // Trend
  const keyFn = gran==='m' ? x => `${x[0]}-${String(x[1]).padStart(2,'0')}` : gran==='q' ? x => `${x[0]} Q${Math.ceil(x[1]/3)}` : x => `${x[0]}`;
  const t = group(rows, keyFn), isLine = gran==='m';
  draw('trend', { type: isLine?'line':'bar', data: { labels: t.map(e=>e[0]), datasets: [
    { label:'Revenue', data:t.map(e=>e[1][0]), borderColor:css('--a1'), backgroundColor:css('--a1'), tension:.3, pointRadius:isLine?2:0 },
    { label:'Profit', data:t.map(e=>e[1][1]), borderColor:css('--a2'), backgroundColor:css('--a2'), tension:.3, pointRadius:isLine?2:0 } ] },
    options: { responsive:true, maintainAspectRatio:false, scales:{ y:axis, x:{ ticks:{ maxTicksLimit:12 } } }, plugins:{ tooltip:{ callbacks:{ label:c=>`${c.dataset.label}: ${money(c.parsed.y)}` } } } } });

  // Top / bottom products
  const p = new Map();
  rows.forEach(x => { const a = p.get(x[4]) || {rev:0,cat:x[3]}; a.rev += x[5]; p.set(x[4], a); });
  const ps = [...p.entries()].sort((a,b) => b[1].rev - a[1].rev), max = ps.length ? ps[0][1].rev : 1;
  const list = (arr, color) => arr.map(([n,a]) => `<div class="row"><div><div class="n">${n}</div><div class="c">${a.cat}</div></div><div class="v">${money(a.rev)}</div><div class="bar"><i style="width:${a.rev/max*100}%;background:${color}"></i></div></div>`).join('');
  $('top').innerHTML = list(ps.slice(0,5), css('--a2'));
  $('bottom').innerHTML = list(ps.slice(-5).reverse(), css('--bad'));

  // Region and category comparison (each ignores its own filter so all bars stay visible)
  const cmp = (id, skip, idx) => {
